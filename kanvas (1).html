<script>
const $=s=>document.querySelector(s)
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}

let PR=1
class Stroker{
constructor(ctx,w,h,bg,ovc){this.main=ctx;this.c=ctx;this.w=w;this.h=h;this.bg=bg;this.ovc=ovc;this.ovx=ovc.getContext('2d');this.mask=null;this.p={tool:'pen',color:'#000',size:4,ti:0,to:0};this.a=null;this.m=null;this.rem=0;this.sp=null;this.sk='';this.tmp=null;this.tc=null;this.pts=[];this.d=0;this.total=null;this.rp=false;this.useOv=false;this.pp=[]}
get active(){return this.a!==null}
setLayer(y){this.main=this.c=y.ctx;this.bg=y.bg?"#ffffff":null}
ek(){return this.bg||"#ffffff"}
tf(){
const p=this.p
if(!(p.ti>0||p.to>0)||this.total===0)return PR
let k=1
if(p.ti>0)k=Math.min(k,this.d/p.ti)
if(p.to>0&&this.total!==null)k=Math.min(k,(this.total-this.d)/p.to)
return (.06+.94*Math.sin(Math.max(0,Math.min(1,k))*1.5708))*PR
}
begin(p,x,y){
this.p=p;this.a={x,y};this.m={x,y};this.rem=0;this.d=0
if(!this.rp){this.pts=[x,y];this.pp=[PR];this.total=null}
const t=p.tool
this.useOv=t!=='blur'&&(p.ti>0||p.to>0||!!p.sel)
this.c=this.useOv?this.ovx:this.main
this.er=t==='eraser'&&!this.bg
const c=this.c,q=this.tf()
c.globalAlpha=1;c.globalCompositeOperation=this.er&&!this.useOv?'destination-out':'source-over'
if(t==='pen'||t==='eraser'){c.fillStyle=t==='eraser'?this.ek():p.color;c.beginPath();c.arc(x,y,(t==='eraser'?p.size*1.5:p.size)*q/2,0,7);c.fill()}
else if(t==='pencil'){c.fillStyle=p.color;c.globalAlpha=.75;c.beginPath();c.arc(x,y,Math.max(.6,p.size*.25)*q,0,7);c.fill();c.globalAlpha=1}
else if(t==='chisel')this.chisel(x,y,x,y)
else if(t==='brush')this.stampLine({x,y},{x,y},this.spacing())
else if(t==='spray')this.spray(x,y)
else if(t==='blur')this.blurAt(x,y)
}
move(x,y){
if(!this.a)return
const a=this.a,b={x,y},t=this.p.tool
if(!this.rp){this.pts.push(x,y);this.pp.push(PR)}
this.d+=Math.hypot(x-a.x,y-a.y)
if(t==='pen'||t==='eraser'||t==='pencil'){const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};this.curve(this.m,a,mid);this.m=mid}
else if(t==='chisel')this.chisel(a.x,a.y,b.x,b.y)
else this.stampLine(a,b,this.spacing())
this.a=b
}
end(){
if(!this.a)return
const t=this.p.tool
if(t==='pen'||t==='eraser'||t==='pencil')this.curve(this.m,this.a,this.a)
this.c.globalAlpha=1;this.c.globalCompositeOperation='source-over';this.a=null;this.m=null
if(!this.rp)this.fin()
}
replay(){
const pts=this.pts,p=this.p
let t=0
for(let i=2;i<pts.length;i+=2)t+=Math.hypot(pts[i]-pts[i-2],pts[i+1]-pts[i-1])
this.ovx.clearRect(0,0,this.w,this.h)
this.rp=true;this.total=t
PR=this.pp[0]||1
this.begin(p,pts[0],pts[1])
for(let i=2;i<pts.length;i+=2){PR=this.pp[i/2]||1;this.move(pts[i],pts[i+1])}
this.end()
this.rp=false
}
fin(){
if(!this.useOv)return
const p=this.p
if(p.to>0||(p.ti>0&&this.pts.length<=2))this.replay()
let src=this.ovc
if(this.mask){
const t=this.tc||(this.tc=document.createElement('canvas'))
t.width=this.w;t.height=this.h
const g=t.getContext('2d')
g.drawImage(this.ovc,0,0);g.globalCompositeOperation='destination-in';g.drawImage(this.mask,0,0)
src=t
}

const restore=async d=>{
startStudio({mode:'solo',w:d.w,h:d.h},null)
try{
const ls=[]
for(const e of d.l){
const y=mkLayer(e.id,e.n,e.bg),b=await createImageBitmap(e.blob)
y.ctx.globalCompositeOperation='copy';y.ctx.drawImage(b,0,0);y.ctx.globalCompositeOperation='source-over'
if(b.close)b.close()
y.v=e.v;y.op=e.op;y.cv.style.opacity=y.op/100;y.blob=e.blob
if(e.ref){y.ref=true;y.tf=e.tf;applyTf(y)}
ls.push(y)
}
S.lay=ls;S.nid=d.nid;S.cur=ls.find(y=>y.id===d.a)||ls.find(y=>!y.ref)
relayer();S.hist=new History(S.w,S.h);S.hist.snap();refresh();drawLP()
}catch(x){toast('Gagal memuat gambar tersimpan')}
}

</script>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg'
const R={c:false,m:false,w:0,h:0,cx:0,cy:0,r:0,ca:0,mx:0,my:0,ma:Math.PI/2,sn:false,la:0,ac:false,mi:null}
const cw=$('#cw'),cols=$('#cols'),z=()=>V.k*V.z
const stl=document.createElement('style')
stl.textContent='.ib.ron{background:#4f46e5;color:#fff}#rls{position:absolute;z-index:10;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}#rls .hd{pointer-events:auto;cursor:grab;touch-action:none}'
document.head.appendChild(stl)
const svg=document.createElementNS(NS,'svg')
svg.id='rls';cw.appendChild(svg)
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
const circ=mk('circle',{fill:'rgba(79,70,229,.06)',stroke:'#4f46e5'})
const axis=mk('line',{stroke:'#db2777'})
const hc=mk('circle',{class:'hd',fill:'#fff',stroke:'#4f46e5'})
const he=mk('circle',{class:'hd',fill:'#4f46e5',stroke:'#fff'})
const hm=mk('circle',{class:'hd',fill:'#fff',stroke:'#db2777'})
const hr=mk('circle',{class:'hd',fill:'#db2777',stroke:'#fff'})
const ensure=()=>{
if(R.w===S.w&&R.h===S.h)return
R.w=S.w;R.h=S.h;R.cx=S.w/2;R.cy=S.h/2;R.r=Math.min(S.w,S.h)*.3;R.ca=0;R.mx=S.w/2;R.my=S.h*.12;R.ma=Math.PI/2
}
const setA=(e,a)=>{for(const k in a)e.setAttribute(k,a[k])}
const draw=()=>{
ensure()
const u=1/z(),sw=2*u
svg.setAttribute('viewBox','0 0 '+S.w+' '+S.h)
circ.style.display=hc.style.display=he.style.display=R.c?'':'none'
axis.style.display=hm.style.display=hr.style.display=R.m?'':'none'
if(R.c){
setA(circ,{cx:R.cx,cy:R.cy,r:R.r,'stroke-width':sw,'stroke-dasharray':8*u+' '+6*u})
setA(hc,{cx:R.cx,cy:R.cy,r:14*u,'stroke-width':sw})
setA(he,{cx:R.cx+R.r*Math.cos(R.ca),cy:R.cy+R.r*Math.sin(R.ca),r:12*u,'stroke-width':sw})
}
if(R.m){
const L=S.w+S.h,dx=Math.cos(R.ma),dy=Math.sin(R.ma),D=Math.min(S.w,S.h)*.3
setA(axis,{x1:R.mx-dx*L,y1:R.my-dy*L,x2:R.mx+dx*L,y2:R.my+dy*L,'stroke-width':sw,'stroke-dasharray':10*u+' '+6*u})
setA(hm,{cx:R.mx,cy:R.my,r:14*u,'stroke-width':sw})
setA(hr,{cx:R.mx+dx*D,cy:R.my+dy*D,r:12*u,'stroke-width':sw})
}
}
const drag=(el,get,set)=>{
let id=null,off=[0,0]
el.addEventListener('pointerdown',e=>{
if(e.pointerType==='mouse'&&e.button!==0)return
e.stopPropagation();e.preventDefault()
el.setPointerCapture(e.pointerId);id=e.pointerId
const p=point(e,$('#mid').getBoundingClientRect()),g=get()
off=[g[0]-p.x,g[1]-p.y]
})
el.addEventListener('pointermove',e=>{
if(id!==e.pointerId)return
e.stopPropagation()
const p=point(e,$('#mid').getBoundingClientRect())
set(p.x+off[0],p.y+off[1]);draw()
})
const end=e=>{if(id===e.pointerId){id=null;e.stopPropagation()}}
el.addEventListener('pointerup',end)
el.addEventListener('pointercancel',end)
}
drag(hc,()=>[R.cx,R.cy],(x,y)=>{R.cx=x;R.cy=y})
drag(he,()=>[R.cx+R.r*Math.cos(R.ca),R.cy+R.r*Math.sin(R.ca)],(x,y)=>{R.r=Math.max(8,Math.hypot(x-R.cx,y-R.cy));R.ca=Math.atan2(y-R.cy,x-R.cx)})
drag(hm,()=>[R.mx,R.my],(x,y)=>{R.mx=x;R.my=y})
drag(hr,()=>{const D=Math.min(S.w,S.h)*.3;return[R.mx+Math.cos(R.ma)*D,R.my+Math.sin(R.ma)*D]},(x,y)=>{R.ma=Math.atan2(y-R.my,x-R.mx)})
const mkb=(title,d)=>{
const b=document.createElement('button')
b.className='ib';b.title=title;b.setAttribute('aria-label',title)
b.innerHTML='<svg viewBox="0 0 24 24">'+d+'</svg>'
cols.appendChild(b);return b
}
const cb=mkb('Penggaris bundar','<circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>')
const mb=mkb('Penggaris cermin','<path d="M12 3v18" stroke-dasharray="2 2"/><path d="M8 7 3 12l5 5zM16 7l5 5-5 5z"/>')
cb.onclick=()=>{R.c=!R.c;cb.classList.toggle('ron',R.c);draw()}
mb.onclick=()=>{R.m=!R.m;mb.classList.toggle('ron',R.m);draw()}
new MutationObserver(draw).observe(cw,{attributes:true,attributeFilter:['style']})
const proj=(x,y)=>{
let vx=x-R.cx,vy=y-R.cy,l=Math.hypot(vx,vy)
if(l<1e-6){vx=1;vy=0;l=1}
return{x:R.cx+R.r*vx/l,y:R.cy+R.r*vy/l,a:Math.atan2(vy,vx)}
}
const refl=(x,y)=>{
const dx=Math.cos(R.ma),dy=Math.sin(R.ma),vx=x-R.mx,vy=y-R.my,d=2*(vx*dx+vy*dy)
return{x:R.mx+d*dx-vx,y:R.my+d*dy-vy}
}
const mirror=()=>{
if(!R.mi||R.mi.w!==S.w||R.mi.h!==S.h)R.mi=new Stroker(S.ctx,S.w,S.h,'#ffffff',$('#ov2'))
return R.mi
}
const P0=Stroker.prototype,ob=P0.begin,om=P0.move,oe=P0.end
P0.begin=function(p,x,y){
if(this!==S.loc||this.rp)return ob.call(this,p,x,y)
ensure()
R.sn=false;R.ac=false
if(R.c&&Math.abs(Math.hypot(x-R.cx,y-R.cy)-R.r)<16/z()+p.size){const q=proj(x,y);R.sn=true;R.la=q.a;x=q.x;y=q.y}
ob.call(this,p,x,y)
if(R.m){
const mi=mirror(),o2=$('#ov2')
mi.main=mi.c=this.main;mi.bg=this.bg;mi.mask=this.mask;mi.rp=false
o2.style.webkitMaskImage=o2.style.maskImage=$('#ov').style.maskImage
o2.style.webkitMaskSize=o2.style.maskSize='100% 100%'
const r=refl(x,y)
ob.call(mi,p,r.x,r.y);R.ac=true
}
}
P0.move=function(x,y){
if(this!==S.loc||this.rp)return om.call(this,x,y)
const pts=[]
if(R.sn){
const q=proj(x,y)
let da=q.a-R.la
while(da>Math.PI)da-=2*Math.PI
while(da<-Math.PI)da+=2*Math.PI
const n=Math.max(1,Math.ceil(Math.abs(da)*R.r/3))
for(let i=1;i<=n;i++){const a=R.la+da*i/n;pts.push({x:R.cx+R.r*Math.cos(a),y:R.cy+R.r*Math.sin(a)})}
R.la+=da
}else pts.push({x,y})
for(const q of pts){
om.call(this,q.x,q.y)
if(R.ac){const r=refl(q.x,q.y);om.call(R.mi,r.x,r.y)}
}
}
P0.end=function(){
if(this===S.loc&&!this.rp&&R.ac){R.ac=false;oe.call(R.mi)}
return oe.call(this)
}
draw()
})()
</script>
<script>
(()=>{
const gd=document.createElement('div'),cw=$('#cw')
gd.id='gd';gd.className='hide'
cw.appendChild(gd)
const b=document.createElement('button')
b.className='ib';b.title='Grid';b.setAttribute('aria-label','Grid')
b.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18"/></svg>'
$('#cols').appendChild(b)
const size=()=>{gd.style.backgroundSize=5000/S.w+'% '+5000/S.h+'%'}
b.onclick=()=>{const on=!gd.classList.toggle('hide');b.classList.toggle('ron',on);size()}
new MutationObserver(()=>{if(!gd.classList.contains('hide'))size()}).observe(cw,{attributes:true,attributeFilter:['style']})
})()
</script>
